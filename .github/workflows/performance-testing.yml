name: 10. Performance testing
run-name: "Run performance test action ${{ inputs.action }} on ${{
  inputs.environment }} "
on:
  workflow_call:
    inputs:
      action:
        type: string
      environment:
        type: string
      k6_script:
        type: string
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "perf-test"
        type: choice
        options:
          - perf-test
          - data-generator
      environment:
        description: "Target environment"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - integration
      k6_script:
        description: "k6 test script to run"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - load
          - soak
          - spike

env:
  # Assuming chart version matches core image tag
  ENV: ${{ inputs.environment }}
jobs:
  deploy:
    environment: ${{ inputs.environment }}
    name: ${{ inputs.action }} on ${{ inputs.environment }}
    runs-on:
      - self-hosted
      - k8s
      - ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
      - name: Deploy with Helm
        id: deploy
        run: |
          stern -n "opencrvs-${ENV}" \
            --since 1s \
            --tail 0 \
            --selector "app.kubernetes.io/instance=${{ inputs.action }}" \
            --template '{{.Message}}{{"\n"}}' \
            . &
          STERN_PID=$!

          touch environments/${ENV}/${{ inputs.action }}.yaml
          helm upgrade --install ${{ inputs.action }} oci://ghcr.io/opencrvs/${{ inputs.action }} \
            -f environments/${ENV}/${{ inputs.action }}.yaml \
            --timeout 5m \
            --wait \
            --namespace "opencrvs-${ENV}" \
            --set k6_script=${{ inputs.k6_script }} \
            --set postgres.user=${{ secrets.POSTGRES_USER }} \
            --set postgres.password=${{ secrets.POSTGRES_PASSWORD }} \
            --set postgres.host=postgres-0.postgres.opencrvs-deps-${ENV}.svc.cluster.local \
            --set env.count=${{ vars.GENERATE_DATA_COUNT_RECORDS }} \
            --set env.sleepMs=0 \
            --set env.batchSize=${{ vars.GENERATE_DATA_BATCH_SIZE }}

          JOB_NAME=$(kubectl get jobs -n "opencrvs-${ENV}" \
            --sort-by=.metadata.creationTimestamp \
            -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n' | grep "^${{ inputs.action }}-" | tail -1) || true

          JOB_STATUS=1
          if [ -n "$JOB_NAME" ]; then
            echo "Waiting for job $JOB_NAME to complete or fail..."
            DEADLINE=$(($(date +%s) + 5400))
            set +e
            while [ "$(date +%s)" -lt "$DEADLINE" ]; do
              CONDITIONS=$(kubectl get job "$JOB_NAME" -n "opencrvs-${ENV}" \
                -o jsonpath='{range .status.conditions[*]}{.type}={.status}{"\n"}{end}' 2>/dev/null)
              if echo "$CONDITIONS" | grep -q "Complete=True"; then
                JOB_STATUS=0
                break
              elif echo "$CONDITIONS" | grep -q "Failed=True"; then
                JOB_STATUS=1
                break
              fi
              sleep 15
            done
            set -e
          fi

          kill $STERN_PID 2>/dev/null || true

          if [ -n "$JOB_NAME" ]; then
            FULL_LOG=$(kubectl logs -n "opencrvs-${ENV}" "job/$JOB_NAME" 2>/dev/null || true)
            ERRORS=$(echo "$FULL_LOG" | grep -E "level=(error|warn)" | sort -u | head -20)
            METRICS=$(echo "$FULL_LOG" | tail -70)
            echo "## k6 Test Summary" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            { [ -n "$ERRORS" ] && echo "$ERRORS" && echo ""; } >> $GITHUB_STEP_SUMMARY || true
            echo "$METRICS" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          exit $JOB_STATUS
      - name: Cleanup Helm Locks
        if: failure() || cancelled()
        run: |
          kubectl -n "opencrvs-${ENV}" get secrets -l owner=helm -o json | \
          jq -r '.items[] | select(.metadata.labels.status=="pending-install" or .metadata.labels.status=="pending-upgrade" or .metadata.labels.status=="pending-rollback") | .metadata.name' | \
          xargs -r kubectl -n "opencrvs-${ENV}" delete secret || \
          echo "No helm locks found, all is good"

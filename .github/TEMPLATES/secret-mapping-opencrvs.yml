dashboards-admin-user:
  type: Opaque
  data:
  # Email address for metabase admin panel login
  - OPENCRVS_METABASE_ADMIN_EMAIL
  # Password for metabase admin panel login
  - OPENCRVS_METABASE_ADMIN_PASSWORD

elasticsearch-admin-user:
  type: Opaque
  data:
  # The Elasticsearch superuser password.
  - ELASTICSEARCH_SUPERUSER_PASSWORD: ELASTIC_PASSWORD

minio-opencrvs-users:
  type: Opaque
  data:
  - MINIO_ROOT_USER:MINIO_ACCESS_KEY
  - MINIO_ROOT_PASSWORD:MINIO_SECRET_KEY
  # Next secrets are needed for data cleanup job:
  # A username for a Minio superuser admin to login to the Minio console to view supporting document attachments submitted during registrations. https://minio-console.<your_domain>
  - MINIO_ROOT_USER
  # A password for a Minio superuser admin
  - MINIO_ROOT_PASSWORD

mongodb-admin-user:
  type: Opaque
  data:
  # The MongoDB superuser admin username. A powerful account that has all rights to OpenCRVS data
  - MONGODB_ADMIN_USER
  # The MongoDB superuser admin password.
  - MONGODB_ADMIN_PASSWORD

postgres-admin-user:
  type: Opaque
  data:
  - POSTGRES_USER
  - POSTGRES_PASSWORD

smtp-config:
  type: Opaque
  data:
  - SENDER_EMAIL_ADDRESS
  - SMTP_HOST
  - SMTP_PASSWORD
  - SMTP_PORT
  - SMTP_SECURE
  - SMTP_USERNAME
  - ALERT_EMAIL

# TODO:

# CONTENT_SECURITY_POLICY_WILDCARD
# This string is supplied to the clients and nginx config and ensures that the format of your domain above can be configurable for CORS purposes.

# NOTIFICATION_TRANSPORT
# A prop which can be used to configure either Email or SMS for staff and beneficiary comms or potentially both.

# One time password while installation
opencrvs-superuser:
  type: Opaque
  data:
    - SUPER_USER_PASSWORD

mosip-api-config:
  type: Opaque
  data:
    # Password to unlock DECRYPT_P12_FILE_PATH keystore in mosip-api.
    - DECRYPT_P12_FILE_PASSWORD
    # Password to unlock SIGN_P12_FILE_PATH keystore in mosip-api.
    - SIGN_P12_FILE_PASSWORD
    # Client secret paired with MOSIP_PACKET_AUTH_CLIENT_ID for packet token requests.
    - MOSIP_PACKET_AUTH_CLIENT_SECRET
    # Client secret paired with MOSIP_WEBSUB_AUTH_CLIENT_ID for WebSub token requests.
    - MOSIP_WEBSUB_AUTH_CLIENT_SECRET
    # Shared hub secret used as `hub.secret` for WebSub subscription and callback validation.
    - MOSIP_WEBSUB_SECRET

mosip-mock-config:
  type: Opaque
  data:
    # The email used to send mock NIDs to Slack/email
    - ALERT_EMAIL: MOSIP_MOCK_SLACK_EMAIL

reference-data-db-secret:
  type: Opaque
  data:
    - REFERENCE_DATA_POSTGRES_USER
    - REFERENCE_DATA_POSTGRES_PASSWORD
    - REFERENCE_DATA_DATABASE_URL
    - REFERENCE_DATA_EDITOR_USER
    - REFERENCE_DATA_EDITOR_PASSWORD
---
- name: Check if Kubernetes is already initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: k8s_init_check

- name: Reset Kubernetes cluster if already initialized
  shell: sudo kubeadm reset -f
  when: k8s_init_check.stat.exists

- name: Initialize Kubernetes cluster
  shell: |
    sudo kubeadm init \
      --apiserver-advertise-address={{ ansible_default_ipv4.address }} \
      --pod-network-cidr={{ pod_network_cidr }} \
      --control-plane-endpoint={{ ansible_default_ipv4.address }}
  register: kubeadm_init_result

- name: Create .kube directory for provision user
  file:
    path: /home/provision/.kube
    state: directory
    mode: '0755'

- name: Remove existing kube config if it exists
  shell: sudo rm -f /home/provision/.kube/config

- name: Copy admin.conf to provision user's kube config
  shell: sudo cp -i /etc/kubernetes/admin.conf /home/provision/.kube/config

- name: Change ownership of kube config to provision user
  shell: sudo chown provision:provision /home/provision/.kube/config

- name: Get join command for worker nodes
  shell: sudo kubeadm token create --print-join-command
  register: join_command

- name: Remove existing join command file if it exists
  local_action:
    module: file
    path: ./join-command.sh
    state: absent

- name: Save join command to local file
  local_action:
    module: copy
    content: "{{ join_command.stdout }}"
    dest: ./join-command.sh

- name: Display initialization result
  debug:
    msg: "{{ kubeadm_init_result.stdout_lines }}"
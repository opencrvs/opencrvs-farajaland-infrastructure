storage_type: host_path
node_selector:
  role: data1

environment_type: non-production

minio:
  use_default_credentials: false

elasticsearch:
  use_default_credentials: false

mongodb:
  use_default_credentials: false

postgres:
  use_default_credentials: false

redis:
  auth_mode: acl

monitoring:
  enabled: true

elastalert:
  env:
    HTTP_POST2_ALERT_URL: http://countryconfig.opencrvs-integration.svc.cluster.local:3040/email

# Backup configuration
backup:
  enabled: false
  schedule: "0 1 * * *"
  backup_server_secret: backup-server-ssh-credentials
  backup_server_dir: /home/backup/integration


# Restore configuration
restore:
  enabled: false
  schedule: "0 0 * * *"
  backup_server_secret: backup-server-ssh-credentials
  backup_server_dir: /home/backup/
  backup_encryption_secret: restore-encryption-secret